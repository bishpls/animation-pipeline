<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>つづく · studio</title>
<style>
  html, body { margin: 0; background: #16151a; color: #ddd; font: 13px ui-monospace, monospace; }
  #out { display: block; width: min(100vw, 1280px); height: auto; aspect-ratio: 16 / 9; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; padding: 8px; }
  .bar input { flex: 1; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script src="../../engine/vendor/fontkit.js"></script>
<script>window.PROJECT = { fps: 24, plain: true, audio: 'assets/mix.wav' };</script>
<script>window.CUES = { bpm: 170, offset: 0, duration: 197, words: [], sections: [], beats: [], rms: [] };</script>
<script src="../../engine/core.js"></script>
<script src="../../engine/riso.js"></script>
<script src="../../engine/type.js"></script>
<script src="../../engine/studio.js"></script>
<script src="../hello-world/src/pop.js"></script>
<script src="src/paper.js"></script>
<script src="src/board.js"></script>
<script src="../../engine/rig.js"></script>
<script src="src/rigtest.js"></script>
<script>
(async () => {
  try {
    plainSetup();
    await Promise.all(Object.entries(FONT_FILES).map(([k, f]) => loadFont(k, '../../engine/fonts/' + f)));
    if (window.PAPER_INIT) await PAPER_INIT();
    window.RIGS = { clawd: await RIG.load('rig/clawd/rig.json') };
    window.WORDS = await (await fetch('assets/words.json')).json();
    if (window.registerFilm) registerFilm();
    window.ready = true;
    studioUI();
  } catch (e) { console.error(e.stack || e); window.failed = true; }
})();
</script>
</body>
</html>
